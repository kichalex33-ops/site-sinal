<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINAL/RUÍDO</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{
    --fundo:#05070c;
    --superficie:#161B22;
    --marca:#E8541D;
    --papel:#F3F4EF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--fundo);
    color:var(--papel);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  #estrelas, #estrelas2, #estrelas3{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
  }
  #estrelas{ animation:deriva 90s linear infinite; }
  #estrelas2{ animation:deriva 150s linear infinite reverse; opacity:.7; }
  #estrelas3{ animation:deriva 220s linear infinite; opacity:.5; }
  @keyframes deriva{
    from{ transform:translateY(0); }
    to{ transform:translateY(-1200px); }
  }
  .gray{
    position:absolute;
    left:50%;
    top:50%;
    width:min(70vw,520px);
    transform:translate(-50%,-56%);
    opacity:.16;
    filter:drop-shadow(0 0 60px rgba(232,84,29,.08));
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:2;
    max-width:560px;
  }
  .marca{
    font-size:clamp(30px,7vw,52px);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--papel);
    margin:0 0 34px;
    font-weight:700;
    text-shadow:0 0 30px rgba(232,84,29,.25);
  }
  .contagem{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:30px;
  }
  .bloco{
    background:rgba(22,27,34,.7);
    backdrop-filter:blur(2px);
    border:1px solid rgba(243,244,239,.1);
    border-radius:10px;
    padding:16px 18px;
    min-width:76px;
  }
  .num{
    font-variant-numeric:tabular-nums;
    font-size:clamp(24px,5vw,34px);
    font-weight:700;
    line-height:1;
    color:var(--papel);
  }
  .label{
    display:block;
    margin-top:6px;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:rgba(243,244,239,.5);
  }
  p.sub{
    color:rgba(243,244,239,.72);
    font-size:15px;
    letter-spacing:.04em;
    margin:0;
  }
  @media (prefers-reduced-motion: reduce){
    #estrelas, #estrelas2, #estrelas3{ animation:none; }
  }
</style>
</head>
<body>
  <svg id="estrelas" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="estrelas2" xmlns="http://www.w3.org/2000/svg"></svg>
  <svg id="estrelas3" xmlns="http://www.w3.org/2000/svg"></svg>

  <svg class="gray" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path fill="#F3F4EF" d="M100 6C55 6 30 55 30 100c0 33 8 60 8 90 0 28 18 62 62 62s62-34 62-62c0-30 8-57 8-90C170 55 145 6 100 6z"/>
    <ellipse cx="66" cy="108" rx="26" ry="34" fill="#05070c"/>
    <ellipse cx="134" cy="108" rx="26" ry="34" fill="#05070c"/>
  </svg>

  <div class="wrap">
    <p class="marca">SINAL/RUÍDO</p>
    <div class="contagem" id="contagem" aria-live="polite">
      <div class="bloco"><span class="num" id="d">00</span><span class="label">dias</span></div>
      <div class="bloco"><span class="num" id="h">00</span><span class="label">horas</span></div>
      <div class="bloco"><span class="num" id="m">00</span><span class="label">min</span></div>
      <div class="bloco"><span class="num" id="s">00</span><span class="label">seg</span></div>
    </div>
    <p class="sub">Preparando o primeiro contato.</p>
  </div>

  <script>
    // Alvo: sexta-feira, 11/09/2026, fim do dia (horário de Brasília).
    var alvo = new Date("2026-09-11T23:59:59-03:00").getTime();
    var elD = document.getElementById("d");
    var elH = document.getElementById("h");
    var elM = document.getElementById("m");
    var elS = document.getElementById("s");

    function pad(n){ return String(n).padStart(2, "0"); }

    function tick(){
      var diff = alvo - Date.now();
      if (diff < 0) diff = 0;
      var dias = Math.floor(diff / 86400000);
      var horas = Math.floor((diff % 86400000) / 3600000);
      var min = Math.floor((diff % 3600000) / 60000);
      var seg = Math.floor((diff % 60000) / 1000);
      elD.textContent = pad(dias);
      elH.textContent = pad(horas);
      elM.textContent = pad(min);
      elS.textContent = pad(seg);
    }
    tick();
    setInterval(tick, 1000);

    // Gera um campo de estrelas simples via box-shadow, sem pedir imagens externas.
    function gerarEstrelas(svgEl, quantidade, tamanho, opacidade){
      var w = window.innerWidth || 1600;
      var h = (window.innerHeight || 900) * 2.5;
      var ns = "http://www.w3.org/2000/svg";
      svgEl.setAttribute("viewBox", "0 0 " + w + " " + h);
      svgEl.setAttribute("preserveAspectRatio", "xMidYMin slice");
      var frag = document.createDocumentFragment();
      for (var i = 0; i < quantidade; i++){
        var c = document.createElementNS(ns, "circle");
        c.setAttribute("cx", Math.random() * w);
        c.setAttribute("cy", Math.random() * h);
        c.setAttribute("r", tamanho);
        c.setAttribute("fill", "#F3F4EF");
        c.setAttribute("opacity", (Math.random() * opacidade).toFixed(2));
        frag.appendChild(c);
      }
      svgEl.appendChild(frag);
    }
    gerarEstrelas(document.getElementById("estrelas"), 140, 1.3, 0.9);
    gerarEstrelas(document.getElementById("estrelas2"), 90, 1.8, 0.7);
    gerarEstrelas(document.getElementById("estrelas3"), 60, 2.4, 0.5);
  </script>
</body>
</html>
